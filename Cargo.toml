[package]
name = "ani"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
clap_complete = "4.6.7"
crossterm = "0.29.0"
graphql_client = "0.16.0"
image = "0.25.10"
reqwest = { version = "0.13", features = ["json"] }
scraper = "0.27.0"
textwrap = "0.16.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# 0.11.0 leaks terminal capability responses into the shell on ghostty
# see viuer issue #94
viuer = "=0.10.0"
